// ---------------------------------------------------------------------------
// Module: web-starter  (artifactId: mpokket-web-starter)
// ---------------------------------------------------------------------------
project(':web-starter') {
    apply plugin: 'au.com.dius.pact'

    publishing {
        publications {
            maven(MavenPublication) { artifactId = 'mpokket-web-starter' }
        }
    }

    sonarqube {
        properties {
            property 'sonar.projectKey', 'mpokket-web-starter'
            property 'sonar.projectName', 'mpokket-web-starter'
            property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacocoReport.xml"
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                element = 'CLASS'
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.85 }
                excludes = ['**.*Config*', '**.model.**', '**.*Exception', '**.exception.*BusinessErrorCode', '**.rest.client.CustomResponseErrorHandler']
            }
        }
    }
    check.dependsOn jacocoTestCoverageVerification

    dependencies {
        api 'org.springframework.boot:spring-boot-starter-actuator'
        api 'org.springframework.boot:spring-boot-starter-web'
        api 'org.springframework.boot:spring-boot-starter-webflux'
        api 'org.springframework.boot:spring-boot-starter-cache'
        api 'org.apache.commons:commons-collections4'
        api 'org.apache.commons:commons-lang3'
        api 'org.fluentd:fluent-logger'
        api 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
        api 'com.github.ben-manes.caffeine:caffeine'
        api project(':microtypes-starter')
        api project(':logging-starter')
        api 'org.yaml:snakeyaml'
        api 'io.micrometer:micrometer-tracing-bridge-otel'
        api 'org.springframework.boot:spring-boot-starter-opentelemetry'
        api 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
        api 'io.github.resilience4j:resilience4j-retry:2.3.0'
        api 'io.github.resilience4j:resilience4j-ratelimiter:2.3.0'
        api 'io.github.resilience4j:resilience4j-micrometer:2.3.0'
        api 'io.github.resilience4j:resilience4j-reactor:2.3.0'

        implementation 'jakarta.annotation:jakarta.annotation-api'
        implementation 'tools.jackson.core:jackson-databind'
        implementation 'tools.jackson.core:jackson-core'
        implementation('com.fasterxml.jackson.core:jackson-annotations') {
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        }
        implementation 'org.springframework.security:spring-security-crypto'

        compileOnly 'jakarta.servlet:jakarta.servlet-api'
        compileOnly 'org.springframework.security:spring-security-web'
        compileOnly 'org.springframework.security:spring-security-core'

        developmentOnly 'org.springframework.boot:spring-boot-devtools'

        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        testImplementation 'org.mockito:mockito-core'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-validation'
        testImplementation 'io.projectreactor:reactor-test'
        testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        testImplementation 'jakarta.validation:jakarta.validation-api'
    }

    test { maxParallelForks = 3 }
}

// ---------------------------------------------------------------------------
// Module: kafka-starter  (artifactId: mpokket-kafka-starter)
// ---------------------------------------------------------------------------
project(':kafka-starter') {
    publishing {
        publications {
            maven(MavenPublication) { artifactId = 'mpokket-kafka-starter' }
        }
    }

    sonarqube {
        properties {
            property 'sonar.projectKey', 'kafka-service'
            property 'sonar.projectName', 'kafka-service'
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                element = 'CLASS'
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.85 }
                excludes = ['**.config*', '**.aspect*', '**.message.**', '**.entity.**', '**.kafka.*KafkaStarterApplication']
            }
        }
    }
    check.dependsOn jacocoTestCoverageVerification

    dependencies {
        api 'org.springframework.kafka:spring-kafka'
        api 'org.springframework.boot:spring-boot-starter-actuator'
        api 'org.springframework:spring-aop'
        api 'org.aspectj:aspectjweaver'
        api 'tools.jackson.core:jackson-core'
        api 'tools.jackson.core:jackson-databind'
        api 'software.amazon.msk:aws-msk-iam-auth'
        api 'org.xerial.snappy:snappy-java:1.1.10.7'
        api 'org.yaml:snakeyaml'
        api 'org.springframework.boot:spring-boot-starter-validation'

        implementation 'org.springframework.boot:spring-boot-starter'
        constraints {
            implementation('com.github.luben:zstd-jni:1.5.7-14') {
                because 'Fixes CVE-2026-87825, CVE-2026-87795, and CVE-2026-87823 in native decompression'
            }
            implementation('at.yawk.lz4:lz4-java:1.11.1') {
                because 'Fixes CVE-2026-59949 JVM crash vulnerability in native XXHash'
            }
        }

        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        testImplementation 'org.testcontainers:testcontainers-kafka'
    }
}

