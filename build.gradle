import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.owasp.dependencycheck' version '12.1.1' apply false
    id 'org.sonarqube' version '6.3.1.5724' apply false
    id 'au.com.dius.pact' version '4.6.15' apply false
}

allprojects {
    group = 'in.mpokket'
    version = sdkVersion
}

subprojects {
    // Skip java config for BOM (it uses java-platform plugin, not java)
    if (project.name == 'bom') return

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'jacoco'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.owasp.dependencycheck'
    apply plugin: 'org.sonarqube'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenLocal()
        maven {
            url = "https://stg-nexus.mpokket.org/repository/maven-public/"
            def nexusUser = System.getenv('NEXUS_CREDENTIALS_USERNAME')
            def nexusPass = System.getenv('NEXUS_CREDENTIALS_PASSWORD')
            if (nexusUser) {
                credentials {
                    username = nexusUser
                    password = nexusPass ?: ''
                }
            }
        }
        mavenCentral()
    }

    // Override Spring Boot's managed Netty version so the whole io.netty family
    // resolves to the CVE-fixed patch instead of the BOM-managed 4.2.17.Final.
    ext['netty.version'] = '4.2.18.Final'
    // =========================================================================
    // REMEDIATION: Patches CVE-2026-19880 Directory Traversal globally.
    // Spring Boot's dependency plugin automatically intercepts this property key
    // =========================================================================
    ext['logback.version'] = '1.6.3'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "in.mpokket:mpokket-common-bom:${bomVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            // Spring Cloud Contract was removed from spring-cloud-dependencies in 2025.1.3,
            // so its BOM must be imported explicitly to manage spring-cloud-starter-contract-verifier.
            mavenBom "org.springframework.cloud:spring-cloud-contract-dependencies:${springCloudContractVersion}"
            mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
        }
        dependencies {

            dependency 'com.fasterxml.jackson.core:jackson-annotations:2.22'
            // The com.fasterxml.jackson (2.x) line is NOT declared by us. It is
            // dragged in transitively by springdoc-openapi-starter-webmvc-ui ->
            // springdoc-openapi-starter-common -> io.swagger.core.v3:swagger-core-jakarta,
            // which still depends on Jackson 2.x (databind/core/dataformat-yaml/
            // datatype-jsr310 via com.fasterxml.jackson:jackson-bom). Without a pin,
            // swagger drags com.fasterxml.jackson.core:jackson-databind 2.21.5, which
            // carries CVE-2026-83557 (CWE-502, deserialization of untrusted data).
            // Pin the 2.x databind/core to the fixed 2.21.6 patch so the transitive
            // resolution cannot settle back on 2.21.5.
            //
            // We cannot drop this 2.x line by migrating our own deps to Jackson 3.x:
            //   - jackson-datatype-jsr310 has no GA 3.x release (only stalled RCs;
            //     java.time support moved into jackson-databind core in 3.x), and
            //   - swagger-core-jakarta requests the 2.x artifacts regardless of what
            //     we declare.
            // The real exit path is a springdoc/swagger release built on Jackson 3.x;
            // until then this pin is the correct control. (The separate
            // tools.jackson.core:* Jackson 3.x line is BOM-managed to 3.2.2 and is
            // unaffected by these entries.)
            //dependency 'com.fasterxml.jackson.core:jackson-databind:2.21.6'
            //dependency 'com.fasterxml.jackson.core:jackson-core:2.21.6'
            //dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.6'
            //dependency 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.6'
            // UPDATE: Pinned to 2.21.7 to patch CVE-2026-89425 (CWE-770, Unbounded memory
            // allocation via UTF8DataInputJsonParser remote DoS).
            dependency 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
            dependency 'com.fasterxml.jackson.core:jackson-core:2.21.7'
            dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.7'
            dependency 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.7'

            // =========================================================================
            // Jackson 3.x line (tools.jackson.core)
            // Overriding BOM-managed 3.2.2 to 3.2.3 to patch CVE-2026-89425
            // (CWE-770, Unbounded memory allocation via UTF8DataInputJsonParser remote DoS).
            // =========================================================================
            dependency 'tools.jackson.core:jackson-core:3.2.3'
            dependency 'tools.jackson.core:jackson-databind:3.2.3'
            // If your web-starter pulls in other 3.x modules, pin them here as well:
            dependency 'tools.jackson.core:jackson-annotations:3.2.3'


            dependency 'org.apache.tomcat.embed:tomcat-embed-core:11.0.23'
            dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.23'
            dependency 'org.apache.tomcat.embed:tomcat-embed-el:11.0.23'
           // dependency 'ch.qos.logback:logback-core:1.5.36'
           // dependency 'ch.qos.logback:logback-classic:1.5.36'
            dependency 'org.springframework.retry:spring-retry:2.0.13'
            dependency 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
            // mpokket-common-bom pins spring-security-* to 7.1.0, which ships the
            // vulnerable spring-security-crypto 7.1.0. Override to the fixed 7.1.1
            // patch across the whole train to keep the security modules consistent.
            // Declared here (not via resolutionStrategy.force) so the Spring
            // dependency-management plugin honors it over the imported BOM.
            dependency 'org.springframework.security:spring-security-crypto:7.1.1'
            dependency 'org.springframework.security:spring-security-core:7.1.1'
            dependency 'org.springframework.security:spring-security-config:7.1.1'
            dependency 'org.springframework.security:spring-security-web:7.1.1'
            dependency 'org.springframework.security:spring-security-test:7.1.1'
            // Removed from spring-cloud-dependencies; pin explicitly for aws-starter / composite builds.
            dependency 'org.springframework.cloud:spring-cloud-starter-bootstrap:5.0.3'

        }
    }

    configurations.all {
        resolutionStrategy {
            // tools.jackson.core versions come from the managed jackson-bom
            // (tools.jackson:jackson-bom, via spring-boot-jackson) — not forced here,
            // so the BOM can drive upgrades.
            force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
            force 'com.github.jknack:handlebars:4.5.2'
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                versionMapping {
                    usage('java-api') { fromResolutionOf('runtimeClasspath') }
                    usage('java-runtime') { fromResolutionResult() }
                }
            }
        }
        repositories {
            maven {
                name = "myNexus"
                url = "https://stg-nexus.mpokket.org/repository/maven-snapshots/"
                credentials {
                    username = System.getenv('NEXUS_CREDENTIALS_USERNAME')
                    password = System.getenv('NEXUS_CREDENTIALS_PASSWORD')
                }
            }
        }
    }

    tasks.withType(GenerateModuleMetadata) {
        suppressedValidationErrors.add('dependencies-without-versions')
    }

    sonarqube {
        properties {
            property 'sonar.host.url', 'http://sonarqube-sonarqube.devops-tools.svc.cluster.local:9000/sonarqube'
            property 'sonar.java.source', 21
            property 'sonar.junit.reportPaths', 'build/results'
            property 'encoding', 'UTF-8'
            property 'charSet', 'UTF-8'
            property "sonar.coverage.jacoco.xmlReportPaths", "/build/reports/jacoco/test/jacocoTestReport.xml"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        systemProperty 'spring.profiles.active', 'test'
    }

    bootJar { enabled = false }

    jacocoTestReport {
        reports {
            xml.required = true
            csv.required = false
            html.required = true
        }
    }

    test.finalizedBy jacocoTestReport

    dependencyCheck {
        failBuildOnCVSS = 0
        suppressionFile = "${rootDir}/dependency-check-suppressions.xml"
    }
}

// ---------------------------------------------------------------------------
// Module: security-starter  (artifactId: mpokket-security-starter)
// ---------------------------------------------------------------------------
project(':security-starter') {
    publishing {
        publications {
            maven(MavenPublication) { artifactId = 'mpokket-security-starter' }
        }
    }

    sonarqube {
        properties {
            property 'sonar.projectKey', 'mpokket-security-starter'
            property 'sonar.projectName', 'mpokket-security-starter'
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                element = 'CLASS'
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.8 }
                excludes = ['**.ApplicationContextUtils.java', '**.model.**', '**.config.**']
            }
        }
    }
    check.dependsOn jacocoTestCoverageVerification

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        // Version managed by tools.jackson:jackson-bom (via spring-boot-jackson) — currently 3.1.5.
        implementation 'tools.jackson.core:jackson-databind'
        implementation 'tools.jackson.core:jackson-core'
        implementation('com.fasterxml.jackson.core:jackson-annotations') {
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        }
        implementation 'jakarta.json:jakarta.json-api'
        implementation 'org.glassfish:jakarta.json'
        implementation 'org.yaml:snakeyaml'
        implementation 'org.springframework.security:spring-security-core'
        implementation 'org.eclipse.parsson:parsson:1.1.8'

        api 'org.springframework.boot:spring-boot-starter-security'
        api 'org.springframework.boot:spring-boot-starter-web'
        api 'org.springframework.security:spring-security-config'
        api 'org.springframework.security:spring-security-web'
        api 'org.springframework:spring-web'
        api 'org.springframework.security:spring-security-crypto'

        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.junit.jupiter:junit-jupiter-params'
        testImplementation 'org.mockito:mockito-junit-jupiter'
        testImplementation 'org.xmlunit:xmlunit-core'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.apache.groovy:groovy'
        testImplementation 'org.spockframework:spock-core'
        testImplementation 'org.spockframework:spock-spring'
    }
}

// ---------------------------------------------------------------------------
// Module: microtypes-starter  (artifactId: micro-types)
// ---------------------------------------------------------------------------
project(':microtypes-starter') {
    publishing {
        publications {
            maven(MavenPublication) { artifactId = 'micro-types' }
        }
    }

    sonarqube {
        properties {
            property 'sonar.projectKey', 'micro-types'
            property 'sonar.projectName', 'micro-types'
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                element = 'CLASS'
                enabled = true
                limit { minimum = 0.8 }
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.85 }
                excludes = ['**.*Config*', '**.model.**', '**.pii.**']
            }
        }
    }
    check.dependsOn jacocoTestCoverageVerification

    dependencies {
        compileOnlyApi project(':security-starter')
        compileOnlyApi 'tools.jackson.core:jackson-databind'
        compileOnlyApi 'jakarta.persistence:jakarta.persistence-api'
        compileOnlyApi 'org.springframework:spring-web'
        compileOnlyApi 'org.springframework.security:spring-security-core'
        compileOnlyApi 'org.springframework.security:spring-security-config'
        compileOnlyApi 'org.springframework.security:spring-security-web'

        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'jakarta.annotation:jakarta.annotation-api'
        implementation 'jakarta.persistence:jakarta.persistence-api'
        implementation 'jakarta.validation:jakarta.validation-api'
        implementation 'org.yaml:snakeyaml'
        implementation 'tools.jackson.core:jackson-databind'
        implementation 'tools.jackson.core:jackson-core'
        implementation('com.fasterxml.jackson.core:jackson-annotations') {
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        }
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation project(':security-starter')
        testImplementation 'tools.jackson.core:jackson-databind'
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    tasks.register('unitTest', Test) {
        description = 'Runs the unit tests.'
        group = 'verification'
        useJUnitPlatform()
        filter { excludeTestsMatching('*IntegrationTest*') }
    }
}

