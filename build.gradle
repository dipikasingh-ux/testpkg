        description = 'Runs the integration tests.'
        group = 'verification'
        useJUnitPlatform()
        filter { includeTestsMatching '*IntegrationTest*' }
    }

    tasks.register('unitTest', Test) {
        description = 'Runs the unit tests.'
        group = 'verification'
        useJUnitPlatform()
        filter { excludeTestsMatching('*IntegrationTest*') }
    }
}

// ---------------------------------------------------------------------------
// Module: cache-connector  (artifactId: mpokket-cache-connector)
// ---------------------------------------------------------------------------
project(':cache-connector') {
    publishing {
        publications {
            maven(MavenPublication) { artifactId = 'mpokket-cache-connector' }
        }
    }

    sonarqube {
        properties {
            property 'sonar.projectKey', 'mpokket-cache-connector'
            property 'sonar.projectName', 'mpokket-cache-connector'
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                limit { minimum = 0.85 }
            }
        }
    }
    check.dependsOn jacocoTestCoverageVerification

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'io.lettuce:lettuce-core'
        implementation 'org.apache.commons:commons-pool2'
        implementation 'tools.jackson.core:jackson-databind'

        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        testImplementation 'org.testcontainers:testcontainers'
    }
}
