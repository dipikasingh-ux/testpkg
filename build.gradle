// ---------------------------------------------------------------------------
// Module: aws-starter  (artifactId: mpokket-aws-starter)
// ---------------------------------------------------------------------------
project(':aws-starter') {
    publishing {
        publications {
            maven(MavenPublication) { artifactId = 'mpokket-aws-starter' }
        }
    }

    sonarqube {
        properties {
            property 'sonar.projectKey', 'mpokket-aws-s3-starter'
            property 'sonar.projectName', 'mpokket-aws-s3-starter'
            property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacocoReport.xml"
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                element = 'CLASS'
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.85 }
                excludes = ['**.config.**', '**.model.**', '**.*exception', '**MapperImpl', '**.constant.**']
            }
        }
    }
    check.dependsOn jacocoTestCoverageVerification

    dependencies {
        implementation project(':web-starter')
        implementation 'org.mapstruct:mapstruct'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
